version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: rpt_backend
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5440:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 3

  web:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.production
    environment:
      RAILS_ENV: production
      DATABASE_URL: postgres://postgres:password@db:5432/rpt_backend
      RAILS_MAX_THREADS: 5
      RAILS_MIN_THREADS: 2
      WEB_CONCURRENCY: 2
    volumes:
      - .:/app
      - bundle_cache:/usr/local/bundle
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    stdin_open: true
    tty: true
    command: bash -c "bundle exec rails db:migrate && bundle exec rails server -b 0.0.0.0 -e production"

  # Optional: Apache reverse proxy (if you want to run it in Docker)
  # apache:
  #   image: httpd:2.4
  #   volumes:
  #     - ./apache.conf:/usr/local/apache2/conf/httpd.conf:ro
  #   ports:
  #     - "80:80"
  #   depends_on:
  #     - web

volumes:
  postgres_data:
  bundle_cache: